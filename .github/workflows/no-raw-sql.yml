name: No Raw SQL

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-raw-sql:
    name: Reject newly introduced raw database SQL
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate Frappe app package
        id: app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t hooks < <(find . -mindepth 2 -maxdepth 3 -type f -name hooks.py -not -path './.git/*' -print)
          if [ "${#hooks[@]}" -ne 1 ]; then
            echo "Expected exactly one Frappe hooks.py, found ${#hooks[@]}" >&2
            exit 1
          fi
          echo "app_dir=$(dirname "${hooks[0]}")" >> "$GITHUB_OUTPUT"

      - name: Reject newly introduced raw database SQL calls
        shell: bash
        env:
          APP_DIR: ${{ steps.app.outputs.app_dir }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          # Existing legacy SQL is tracked separately. Only added lines block CI.
          # Full-history checkout makes PR comparisons and multi-commit pushes reliable.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --unified=0 "$PR_BASE_SHA" HEAD -- "$APP_DIR" > /tmp/raw-sql-diff.patch
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && [[ ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --unified=0 "$PUSH_BEFORE_SHA" HEAD -- "$APP_DIR" > /tmp/raw-sql-diff.patch
          else
            echo "No reliable comparison base: running non-blocking legacy inventory."
            grep -RInE --include='*.py' 'frappe[.]db[.](sql|multisql)|db[.]sql[[:space:]]*[(]' "$APP_DIR" || true
            exit 0
          fi

          # Parse added source lines only (not diff metadata or removed lines).
          # Ignore literal strings/comments by using Python's tokenizer.
          python3 - <<'PY'
          import ast
          import os
          import subprocess
          import sys
          import tokenize
          from io import BytesIO

          diff = open("/tmp/raw-sql-diff.patch", encoding="utf-8").read()
          offenders = []
          path = None
          for line in diff.splitlines():
              if line.startswith("+++ b/"):
                  path = line[6:]
              elif line.startswith("+") and not line.startswith("+++"):
                  candidate = line[1:]
                  if not path or not path.endswith(".py"):
                      continue
                  if "frappe.db.sql" in candidate or "frappe.db.multisql" in candidate or "db.sql(" in candidate:
                      stripped = candidate.lstrip()
                      if stripped.startswith("#"):
                          continue
                      offenders.append((path, candidate.strip()))
          if offenders:
              for path, line in offenders:
                  print(f"::error file={path}::New raw SQL usage: {line}")
              sys.exit(1)
          print("No newly introduced raw SQL calls found.")
          PY
